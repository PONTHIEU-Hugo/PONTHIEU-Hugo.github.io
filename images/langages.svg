<svg xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    SPRITE DES LOGOS DE LANGAGES
    Un seul fichier, téléchargé une fois puis mis en cache, qui contient tous les logos.
    Chaque <symbol> a un id ; on l'affiche ailleurs avec :
      <svg class="lang-icon"><use href="images/langages.svg#cpp"></use></svg>
    La couleur vient de "color" dans le CSS (fill/stroke="currentColor").

    Pour ajouter un logo :
    1. copie un <symbol>, change son id ;
    2. remplace le <path> (SVG monochrome, par exemple sur simpleicons.org)
       et garde le viewBox d'origine du logo ;
    3. mets fill="currentColor" sur le tracé (ou stroke="currentColor" pour une icône en traits).
  -->

